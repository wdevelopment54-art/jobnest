{% extends "base.html" %}

{% block content %}
<section class="dashboard">
    <div class="container">
        <div class="dashboard-head"><div><h1>Notifications</h1></div></div>
        {% if notifications %}
        <ul class="note-list full">
            {% for n in notifications %}
            <li class="{% if not n.is_read %}unread{% endif %}">
                <div class="note-body"><strong>{{ n.title }}</strong><p>{{ n.message }}</p><span>{{ time_ago(n.created_at) }}</span></div>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <div class="empty-state"><i class="fa-solid fa-bell"></i><p>No notifications.</p></div>
        {% endif %}
    </div>
</section>
{% endblock %}
